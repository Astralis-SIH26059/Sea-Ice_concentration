version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Mount the local data folder to /data in the container
      # This matches BASE_DIR / "data" since BASE_DIR resolves to / in the container
      - ./data:/data
    restart: unless-stopped
    # environment:
    #   - ENVIRONMENT=production
